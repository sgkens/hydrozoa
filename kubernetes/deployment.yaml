apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrozoa
  labels:
    app: hydrozoa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydrozoa
  template:
    metadata:
      labels:
        app: hydrozoa
    spec:
      containers:
      - name: hydrozoa
        image: hydrozoa:latest # Replace with your registry image
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: hydrozoa-config
---
apiVersion: v1
kind: Service
metadata:
  name: hydrozoa-service
spec:
  selector:
    app: hydrozoa
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydrozoa-config
data:
  NODE_ENV: "production"
  # Add other environment variables here
