apiVersion: v1
kind: Secret
metadata:
  name: hydrozoa-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://hydrozoa:replace-me@postgres:5432/hydrozoa"
  JWT_SECRET: "replace-with-a-unique-random-value-at-least-32-characters"
  HYDROZOA_MASTER_KEY: "replace-with-a-unique-random-value-at-least-32-characters"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-a-strong-initial-password"
