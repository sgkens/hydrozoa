<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body class="page-{{ page.title | default: "home" | slugify }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="ocean-field" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    {%- include header.html -%}
    <main id="main-content" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
