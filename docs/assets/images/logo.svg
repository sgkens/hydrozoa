<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
  </defs>
  <style>
    .hydro-body { transform-origin: 50px 48px; animation: hydro-pulse 4s ease-in-out infinite; }
    .tentacle { transform-origin: top center; animation: tentacle-wave 3.2s ease-in-out infinite alternate; }
    .tentacle:nth-of-type(3) { animation-delay: -.6s; }
    .tentacle:nth-of-type(4) { animation-delay: -1.2s; }
    .tentacle:nth-of-type(5) { animation-delay: -1.8s; }
    .tentacle:nth-of-type(6) { animation-delay: -2.4s; }
    @keyframes hydro-pulse { 50% { transform: scale(1.045) rotate(2deg); } }
    @keyframes tentacle-wave { to { transform: skewX(5deg) translateX(1px); } }
    @media (prefers-reduced-motion: reduce) { .hydro-body,.tentacle { animation: none; } }
  </style>
  <g class="hydro-body">
  <path
    d="M 50 20 C 30 20 15 35 15 55 C 15 65 25 70 50 70 C 75 70 85 65 85 55 C 85 35 70 20 50 20 Z" 
    fill="url(#logoGrad)" 
    opacity="0.9"
  />
  <path class="tentacle" d="M 30 70 Q 25 85 30 95" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
  <path class="tentacle" d="M 40 70 Q 35 90 40 95" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
  <path class="tentacle" d="M 50 70 Q 45 85 50 95" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
  <path class="tentacle" d="M 60 70 Q 55 90 60 95" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
  <path class="tentacle" d="M 70 70 Q 65 85 70 95" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="45" r="8" fill="white" opacity="0.3" />
  </g>
</svg>
