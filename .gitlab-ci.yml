default:
  image: "skgens/phellams-automator:${AUTOMATOR_VERSION}"

stages:
  - verify
  - package
  - publish

variables:
  AUTOMATOR_VERSION: "latest"
  BUNDLE_PATH: "$CI_PROJECT_DIR/docs/vendor/bundle"
  DOCKER_IMAGE: "docker.io/skgens/hydrozoa"

verify_app:
  stage: verify
  script:
    - bun install --no-save
    - bun run lint
    - bun run build

verify_docs:
  stage: verify
  script:
    - pwsh ./build-docs.ps1 -Build -Trace
  artifacts:
    paths:
      - _site/
    expire_in: 1 week

build_image:
  stage: package
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - pwsh ./build-dockerimage.ps1 -ImageName "$DOCKER_IMAGE"
    - docker save "$DOCKER_IMAGE:$(pwsh -NoProfile -Command '. ./tools/Get-ConventionalCommitVersion.ps1; (Get-ConventionalCommitVersion).Version')" --output hydrozoa-image.tar
  artifacts:
    paths:
      - hydrozoa-image.tar
    expire_in: 1 day

publish_image:
  stage: publish
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build_image
      artifacts: true
  before_script:
    - test -n "$DOCKER_HUB_USER"
    - test -n "$DOCKER_HUB_TOKEN"
    - echo "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USER" --password-stdin
  script:
    - docker load --input hydrozoa-image.tar
    - export BUILD_VERSION="$(pwsh -NoProfile -Command '. ./tools/Get-ConventionalCommitVersion.ps1; (Get-ConventionalCommitVersion).Version')"
    - docker push "$DOCKER_IMAGE:$BUILD_VERSION"
    - docker tag "$DOCKER_IMAGE:$BUILD_VERSION" "$DOCKER_IMAGE:latest"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_TAG'
