stages:
  - version
  - build
  - lint
  - docker-build
  - docker-push
  - release

variables:
  DOCKER_IMAGE: "index.docker.io/$DOCKER_HUB_USER/hydrozoa"

# 1. Versioning Stage
generate_version:
  stage: version
  image: mcr.microsoft.com/powershell:lts-alpine
  script:
    - pwsh -File devops/generate-build-env.ps1
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env

# 2. Frontend Build Stage
build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# 3. Lint/Test Stage
lint_code:
  stage: lint
  image: node:20-alpine
  script:
    - npm install
    - npm run lint

# 4. Docker Build Stage
build_image:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - job: generate_version
      artifacts: true
    - job: build_frontend
      artifacts: true
  script:
    - docker build -t $DOCKER_IMAGE:$BUILD_VERSION .
    - docker save $DOCKER_IMAGE:$BUILD_VERSION > hydrozoa_image.tar
  artifacts:
    paths:
      - hydrozoa_image.tar
    expire_in: 1 hour

# 5. Docker Push Stage
push_image:
  stage: docker-push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - job: generate_version
      artifacts: true
    - job: build_image
      artifacts: true
  script:
    - docker load < hydrozoa_image.tar
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker push $DOCKER_IMAGE:$BUILD_VERSION
    - docker tag $DOCKER_IMAGE:$BUILD_VERSION $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:latest
  only:
    - main

# 6. GitLab Release Stage
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: generate_version
      artifacts: true
    - job: build_frontend
      artifacts: true
  before_script:
    - apk add --no-cache zip curl
  script:
    - echo "Creating release for version $BUILD_VERSION"
    - PACKAGE_NAME="hydrozoa"
    - FILE_NAME="Hydrozoa-$BUILD_VERSION.zip"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${BUILD_VERSION}/${FILE_NAME}"
    - zip -r "$FILE_NAME" dist server.ts package.json metadata.json devops
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$FILE_NAME" \
           "${PACKAGE_URL}"
    - |
      release-cli create --name "Release $BUILD_VERSION" \
        --description "$(cat release.md)" \
        --tag-name "v$BUILD_VERSION" \
        --assets-link "{\"name\":\"${FILE_NAME}\",\"url\":\"${PACKAGE_URL}\"}"
  only:
    - main
